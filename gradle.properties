group=io.github.sendablemetatype.webrtc
# The upstream version this fork is based on, then the fork's own iteration.
version=0.17.0-sm.1

# The WebRTC branch to check out and build: the newest Chromium milestone
# branch. The other build parameters are described in docs/guide/build.md.
webrtc.branch=branch-heads/8037

# This fork builds the data channels only variant, see docs/guide/build.md.
webrtc.variant=data-channels

# The newest SDK the GitHub runners ship; branch-heads/8037 expects 10.0.28000.0.
webrtc.windows.sdk.version=10.0.26100.0
