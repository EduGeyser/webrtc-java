group=io.github.sendablemetatype.webrtc
# The upstream version this fork is based on, then the fork's own iteration.
version=1.0.1-sm.2-SNAPSHOT

# The WebRTC revision to check out and build: a commit on main, where changes
# land before any release branch, moved forward deliberately. A commit rather
# than main itself keeps every platform of a build on the same sources. The
# other build parameters are described in docs/guide/build.md.
webrtc.branch=eeb7e6beb2e20c5a273922fdf22b75a75cc28ad5

# This fork builds the data channels only variant, see docs/guide/build.md.
webrtc.variant=data-channels

# The FFmpeg release the media module's third-party/ffmpeg submodule is pinned to.
ffmpeg.version=9.0.2
