name: Build

on:
  push:
    branches:
      - main
    paths:
      - "**.cpp"
      - "**.h"
      - "**.java"

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      variant:
        description: "The variant of the native library: full, or data-channels for a library without audio and video support."
        required: false
        type: choice
        options:
          - full
          - data-channels
        default: data-channels

env:
  WEBRTC_CHECKOUT_FOLDER: webrtc
  WEBRTC_INSTALL_FOLDER: webrtc/build

jobs:
  build-windows:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: windows_x86_64
            runs-on: windows-2022
          - name: windows_arm64
            runs-on: windows-2022
        java: [17]
    runs-on: ${{ matrix.platform.runs-on }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - id: prepare
        name: Prepare build
        uses: ./.github/actions/prepare-windows

      - id: gradle-build
        name: Gradle build
        uses: ./.github/actions/build
        with:
          java-version: ${{ matrix.java }}
          platform-name: ${{ matrix.platform.name }}
          variant: ${{ inputs.variant }}

  build-linux:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux_arm
            runs-on: ubuntu-22.04
          - name: linux_arm64
            runs-on: ubuntu-22.04
          - name: linux_x86-64
            runs-on: ubuntu-22.04
        java: [17]
    runs-on: ${{ matrix.platform.runs-on }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - id: prepare
        name: Prepare build
        uses: ./.github/actions/prepare-linux

      - id: gradle-build
        name: Gradle build
        uses: ./.github/actions/build
        with:
          java-version: ${{ matrix.java }}
          platform-name: ${{ matrix.platform.name }}
          variant: ${{ inputs.variant }}

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        platform:
          # The Intel library is cross compiled on the arm64 runner and tested
          # on an Intel runner below.
          - name: macos_x86-64
            runs-on: macos-14
          - name: macos_arm64
            runs-on: macos-14
        java: [17]
    runs-on: ${{ matrix.platform.runs-on }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - id: prepare-build
        name: Prepare build
        uses: ./.github/actions/prepare-macos

      - id: gradle-build
        name: Gradle build
        uses: ./.github/actions/build
        with:
          java-version: ${{ matrix.java }}
          platform-name: ${{ matrix.platform.name }}
          variant: ${{ inputs.variant }}

  # Every platform is tested on a runner of its own, on every runner image in
  # use, against the uploaded jar.
  test-natives:
    needs: [build-windows, build-linux, build-macos]
    uses: ./.github/workflows/test-natives.yml
    with:
      variant: ${{ inputs.variant }}
