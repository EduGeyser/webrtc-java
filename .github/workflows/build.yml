name: Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/pages.yml"

  # A change that only touches docs cannot affect the native build. The docs
  # site has its own check in pages.yml.
  pull_request:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/pages.yml"

  workflow_dispatch:
    inputs:
      variant:
        description: "The variant of the native library: full, or data-channels for a library without audio and video support."
        required: false
        type: choice
        options:
          - full
          - data-channels
        default: data-channels
      upload-webrtc-install:
        description: "Upload the compiled Linux x86-64 WebRTC install tree."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# A new push to a PR supersedes its running build. Runs on main are kept,
# since each one refreshes the caches.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  platforms:
    uses: ./.github/workflows/platforms.yml
    with:
      variant: ${{ inputs.variant }}
      upload-webrtc-install: ${{ github.event_name == 'workflow_dispatch' && inputs.upload-webrtc-install }}
      # Only the tests of this same run read them.
      retention-days: 1
