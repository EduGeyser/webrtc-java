name: Build

on:
  push:
    branches:
      - main
    paths:
      - "**.cpp"
      - "**.h"
      - "**.java"

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      variant:
        description: "The variant of the native library: full, or data-channels for a library without audio and video support."
        required: false
        type: choice
        options:
          - full
          - data-channels
        default: data-channels

env:
  WEBRTC_CHECKOUT_FOLDER: webrtc
  WEBRTC_INSTALL_FOLDER: webrtc/build

jobs:
  build-windows:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: windows_x86_64
            runs-on: windows-2022
          - name: windows_arm64
            runs-on: windows-2022
        java: [17]
    runs-on: ${{ matrix.platform.runs-on }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - id: prepare
        name: Prepare build
        uses: ./.github/actions/prepare-windows

      - id: gradle-build
        name: Gradle build
        uses: ./.github/actions/build
        with:
          java-version: ${{ matrix.java }}
          platform-name: ${{ matrix.platform.name }}
          variant: ${{ inputs.variant }}

  build-linux:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux_arm
            runs-on: ubuntu-22.04
          - name: linux_arm64
            runs-on: ubuntu-22.04
          - name: linux_x86-64
            runs-on: ubuntu-22.04
        java: [17]
    runs-on: ${{ matrix.platform.runs-on }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - id: prepare
        name: Prepare build
        uses: ./.github/actions/prepare-linux

      - id: gradle-build
        name: Gradle build
        uses: ./.github/actions/build
        with:
          java-version: ${{ matrix.java }}
          platform-name: ${{ matrix.platform.name }}
          variant: ${{ inputs.variant }}

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        platform:
          # The Intel library is cross compiled on the arm64 runner and tested
          # on an Intel runner below.
          - name: macos_x86-64
            runs-on: macos-14
          - name: macos_arm64
            runs-on: macos-14
        java: [17]
    runs-on: ${{ matrix.platform.runs-on }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - id: prepare-build
        name: Prepare build
        uses: ./.github/actions/prepare-macos

      - id: gradle-build
        name: Gradle build
        uses: ./.github/actions/build
        with:
          java-version: ${{ matrix.java }}
          platform-name: ${{ matrix.platform.name }}
          variant: ${{ inputs.variant }}

  # Every platform is tested on a runner of its own, on every runner image in
  # use, against the uploaded jar.
  test-natives:
    needs: [build-windows, build-linux, build-macos]
    uses: ./.github/workflows/test-natives.yml
    with:
      variant: ${{ inputs.variant }}

  # Snapshots leave only once every platform has passed its tests, and all of
  # them at once, as one deployment.
  deploy-snapshots:
    needs: test-natives
    if: ${{ github.event_name != 'pull_request' && github.repository == 'EduGeyser/webrtc-java' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Derive the variant
        run: |
          variant="${{ inputs.variant }}"
          if [ -z "$variant" ]; then
            variant=$(sed -n 's/^webrtc.variant=//p' gradle.properties)
          fi
          if [ "$variant" == "data-channels" ]; then
            echo "WEBRTC_VARIANT_ARG=-Pwebrtc.variant=data-channels" >> "$GITHUB_ENV"
          else
            echo "WEBRTC_VARIANT_ARG=" >> "$GITHUB_ENV"
          fi

      - name: Download the native library jars of all platforms
        uses: actions/download-artifact@v4
        with:
          pattern: natives-*
          path: natives
          merge-multiple: true

      - name: Publish snapshots
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_TOKEN: ${{ secrets.MAVEN_TOKEN }}
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties)
          case "$version" in
            *-SNAPSHOT) ;;
            *) echo "$version is not a snapshot version, nothing to publish"; exit 0 ;;
          esac
          ./gradlew publishAggregationToCentralPortalSnapshots -Pnatives.dir=natives $WEBRTC_VARIANT_ARG
