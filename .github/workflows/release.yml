name: Prepare release

on:
  workflow_dispatch:
    inputs:
      developmentVersion:
        description: "Default version to use for new local working copy."
        required: true
        default: "X.Y.Z-sm.N-SNAPSHOT"
      dryRun:
        description: "Dry run: build every platform with the release version and assemble the deployment bundle, but push no commits or tags and publish nothing."
        required: false
        type: boolean
        default: false

# Only preparation pushes commits and the tag and starts the publication. The
# jobs of a dry run stay read-only.
permissions:
  contents: read

# Two releases at once would race on the pushed commits and tags.
concurrency:
  group: release-prepare
  cancel-in-progress: false

jobs:
  # Nothing reaches main before the release is prepared: the changelog commit,
  # the release commit, the tag and the development commit are made locally
  # and pushed in one atomic push at the end. A failure on the way leaves main
  # untouched, so the release can simply be dispatched again.
  prepare-release:
    name: Prepare release
    # A release is made from main. A dry run can check another branch first.
    if: github.ref == 'refs/heads/main' || inputs.dryRun
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      actions: write
    outputs:
      release_version: ${{ steps.release-version.outputs.version }}
    steps:
      # The full history, for git-cliff.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Git config
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

      # The release version is the one gradle.properties carries without
      # -SNAPSHOT, not one derived from the commits, so that the changelog, the
      # tag and the GitHub release always agree.
      - name: Determine and check the versions
        id: release-version
        env:
          DEVELOPMENT_VERSION: ${{ inputs.developmentVersion }}
        run: |
          current=$(sed -n 's/^version=//p' gradle.properties)
          version="${current%-SNAPSHOT}"
          echo "Release version: $version, next development version: $DEVELOPMENT_VERSION"

          if [ "$current" == "$version" ]; then
            echo "::error::gradle.properties has $current, which is not a snapshot"
            exit 1
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-sm\.[0-9]+$ ]]; then
            echo "::error::The release version must look like 1.2.3-sm.4, got '$version'"
            exit 1
          fi
          if ! [[ "$DEVELOPMENT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-sm\.[0-9]+-SNAPSHOT$ ]]; then
            echo "::error::developmentVersion must look like 1.2.3-sm.4-SNAPSHOT, got '$DEVELOPMENT_VERSION'"
            exit 1
          fi
          if [ "${DEVELOPMENT_VERSION%-SNAPSHOT}" == "$version" ]; then
            echo "::error::developmentVersion must differ from the release version $version"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::Tag v$version already exists"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      # The new release's section is added on top of the file; the older
      # sections are left as they are.
      - name: Update CHANGELOG.md
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: .github/changelog/cliff.toml
          args: -v --prepend CHANGELOG.md -u --tag ${{ steps.release-version.outputs.tag }} --use-branch-tags

      # The release commit sets the release version, records it in the
      # documentation and is tagged, so that the tagged tree names the version
      # it releases; the next commit moves on to the development version. A dry
      # run creates no commit and no tag.
      - name: Prepare release
        if: ${{ !inputs.dryRun }}
        env:
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
          RELEASE_TAG: ${{ steps.release-version.outputs.tag }}
          DEVELOPMENT_VERSION: ${{ inputs.developmentVersion }}
        run: |
          git add CHANGELOG.md
          git commit -m "chore(release): Update CHANGELOG.md for $RELEASE_TAG"

          sed -i "s/^version=.*/version=$RELEASE_VERSION/" gradle.properties
          sed -i "s/VERSION: '.*'/VERSION: '$RELEASE_VERSION'/g" docs/.vitepress/versions.ts
          git commit -am "Prepare release $RELEASE_TAG"
          git tag -a "$RELEASE_TAG" -m "$RELEASE_TAG"

          sed -i "s/^version=.*/version=$DEVELOPMENT_VERSION/" gradle.properties
          git commit -am "Prepare for next development iteration"

      # The branch and the tag land together or not at all. The push fails if
      # main has moved since the dispatch.
      - name: Push release commits and tag
        if: ${{ !inputs.dryRun }}
        env:
          RELEASE_TAG: ${{ steps.release-version.outputs.tag }}
        run: git push --atomic origin HEAD:main "refs/tags/$RELEASE_TAG"

      # A tag that GITHUB_TOKEN pushes starts no workflow, but GITHUB_TOKEN may
      # dispatch one. --ref makes the release commit the github.sha of the new
      # run.
      - name: Start publication on the release tag
        if: ${{ !inputs.dryRun }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release-version.outputs.tag }}
        run: gh workflow run release-publish.yml --ref "$RELEASE_TAG"

  # A dry run builds and tests the dispatched commit with the release version,
  # so that the jars and the bundle are named as in a release. The variant is
  # the one gradle.properties selects.
  platforms:
    needs: prepare-release
    if: inputs.dryRun
    uses: ./.github/workflows/platforms.yml
    with:
      version: ${{ needs.prepare-release.outputs.release_version }}
      retention-days: 7

  dry-run-bundle:
    name: Assemble dry-run deployment bundle
    needs: [prepare-release, platforms]
    if: inputs.dryRun
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up JDK 27
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '27'
          distribution: 'liberica'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # The full variant adds the natives-media-* jars of the media module.
      - name: Download the native library jars of all platforms
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: natives-*
          path: natives
          merge-multiple: true

      # The bundle is assembled and signed as for a release, but not uploaded.
      # The Central credentials are a placeholder as a second line of defence,
      # so an upload would fail on authentication instead of publishing a
      # release. Signing does run, which checks the GPG key.
      - name: Assemble the deployment bundle
        env:
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.release_version }}
          MAVEN_USERNAME: dry-run-must-not-upload
          MAVEN_TOKEN: dry-run-must-not-upload
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: ./gradlew nmcpZipAggregation -Pnatives.dir=natives -Pversion="$RELEASE_VERSION"

      - name: Check that the deployment bundle exists
        run: test -s build/nmcp/zip/aggregation.zip

      - name: Summarize what would have been published
        env:
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.release_version }}
        run: |
          {
            echo "## Dry run: nothing was published"
            echo
            echo "Version: \`$RELEASE_VERSION\`"
            echo
            echo "Contents of the deployment bundle:"
            echo '```'
            unzip -Z1 build/nmcp/zip/aggregation.zip
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the deployment bundle for inspection
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployment-bundle-dry-run
          path: build/nmcp/zip/aggregation.zip
          if-no-files-found: error
          retention-days: 7
