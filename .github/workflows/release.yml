name: Release

on:
  workflow_dispatch:
    inputs:
      developmentVersion:
        description: "Default version to use for new local working copy."
        required: true
        default: "X.Y.Z-SNAPSHOT"
      dryRun:
        description: "Dry run: build every platform and assemble the deployment bundle, but push no commits or tags and publish nothing."
        required: false
        type: boolean
        default: false

env:
  WEBRTC_CHECKOUT_FOLDER: webrtc
  WEBRTC_INSTALL_FOLDER: webrtc/build

jobs:
  changelog:
    name: Generate changelog
    runs-on: ubuntu-latest
    outputs:
      release_body: ${{ steps.git-cliff.outputs.content }}
      release_version: ${{ steps.git-cliff.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Git config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Generate changelog for the current build
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: .github/changelog/cliff-release.toml
          args: -v -u --strip footer --bump --use-branch-tags

      - name: Update CHANGELOG.md
        uses: orhun/git-cliff-action@v4
        with:
          config: .github/changelog/cliff.toml
          args: -v --bump --use-branch-tags
        env:
          OUTPUT: CHANGELOG.md

      - name: Commit CHANGELOG.md
        if: ${{ !inputs.dryRun }}
        run: |
          git add CHANGELOG.md
          git commit -m "chore(release): Update CHANGELOG.md for ${{ steps.git-cliff.outputs.version }}"
          git push

  prepare-release:
    name: Prepare release
    needs: changelog
    outputs:
      release_body: ${{ needs.changelog.outputs.release_body }}
      release_version: ${{ needs.changelog.outputs.release_version }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: main
      - run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

      # The release version is the current version without its -SNAPSHOT
      # suffix. The release commit sets it and is tagged; the next commit moves
      # on to the development version. A dry run only reports the versions.
      - name: Prepare release
        run: |
          current=$(sed -n 's/^version=//p' gradle.properties)
          release="${current%-SNAPSHOT}"
          development="${{ github.event.inputs.developmentVersion }}"

          echo "Release version: $release, next development version: $development"
          echo "RELEASE_VERSION=$release" >> "$GITHUB_ENV"

          if [ "${{ inputs.dryRun }}" == "true" ]; then
            exit 0
          fi

          sed -i "s/^version=.*/version=$release/" gradle.properties
          git commit -am "Prepare release v$release"
          git tag -a "v$release" -m "v$release"

          sed -i "s/^version=.*/version=$development/" gradle.properties
          git commit -am "Prepare for next development iteration"

      - name: Push release commit and tag
        if: ${{ !inputs.dryRun }}
        run: |
          # Update versions.ts file
          echo "Updating versions.ts with release version: $RELEASE_VERSION and development version: ${{ github.event.inputs.developmentVersion }}"
          sed -i "s/VERSION: '.*'/VERSION: '$RELEASE_VERSION'/g" docs/.vitepress/versions.ts
          sed -i "s/VERSION_SNAPSHOT: '.*'/VERSION_SNAPSHOT: '${{ github.event.inputs.developmentVersion }}'/g" docs/.vitepress/versions.ts

          # Add the updated file to the existing commit
          git add docs/.vitepress/versions.ts
          git commit --amend --no-edit

          git push
          git push --tags

  build-windows:
    needs: prepare-release
    outputs:
      release_body: ${{ needs.prepare-release.outputs.release_body }}
      release_version: ${{ needs.prepare-release.outputs.release_version }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: windows_x86_64
            runs-on: windows-2022
          - name: windows_arm64
            runs-on: windows-2022
        java: [17]
    runs-on: ${{ matrix.platform.runs-on }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-tags: true

      - name: Get tag from current branch
        id: tag-selector
        if: ${{ !inputs.dryRun }}
        shell: bash
        run: |
          git fetch -a
          tag=$(git describe --tags `git rev-list --tags --max-count=1`)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          git checkout $tag

      - id: prepare
        name: Prepare release build
        uses: ./.github/actions/prepare-windows

      - id: gradle-build
        name: Gradle build
        uses: ./.github/actions/release
        with:
          java-version: ${{ matrix.java }}
          platform-name: ${{ matrix.platform.name }}

  build-linux:
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux_arm
            runs-on: ubuntu-22.04
          - name: linux_arm64
            runs-on: ubuntu-22.04
          - name: linux_x86-64
            runs-on: ubuntu-22.04
        java: [17]
    runs-on: ${{ matrix.platform.runs-on }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-tags: true

      - name: Get tag from current branch
        id: tag-selector
        if: ${{ !inputs.dryRun }}
        run: |
          git fetch -a
          tag=$(git describe --tags `git rev-list --tags --max-count=1`)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          git checkout $tag

      - id: prepare-build
        name: Prepare release build
        uses: ./.github/actions/prepare-linux

      - id: gradle-build
        name: Gradle build
        uses: ./.github/actions/release
        with:
          java-version: ${{ matrix.java }}
          platform-name: ${{ matrix.platform.name }}

  build-macos:
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        platform:
          # The Intel library is cross compiled on the arm64 runner.
          - name: macos_x86-64
            runs-on: macos-14
          - name: macos_arm64
            runs-on: macos-14
        java: [17]
    runs-on: ${{ matrix.platform.runs-on }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-tags: true

      - name: Get tag from current branch
        id: tag-selector
        if: ${{ !inputs.dryRun }}
        run: |
          git fetch -a
          tag=$(git describe --tags `git rev-list --tags --max-count=1`)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          git checkout $tag

      - id: prepare-build
        name: Prepare release build
        uses: ./.github/actions/prepare-macos

      - id: gradle-build
        name: Gradle build
        uses: ./.github/actions/release
        with:
          java-version: ${{ matrix.java }}
          platform-name: ${{ matrix.platform.name }}

  publish-central:
    name: Publish to Maven Central
    needs: [build-windows, build-linux, build-macos]
    outputs:
      release_body: ${{ needs.build-windows.outputs.release_body }}
      release_version: ${{ needs.build-windows.outputs.release_version }}
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-tags: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Determine the version to publish
        id: release-version
        run: |
          if [ "${{ inputs.dryRun }}" != "true" ]; then
            git fetch -a
            tag=$(git describe --tags `git rev-list --tags --max-count=1`)
            git checkout "$tag"
          fi

          version=$(sed -n 's/^version=//p' gradle.properties)

          echo "Version to publish: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download the native library jars of all platforms
        uses: actions/download-artifact@v4
        with:
          pattern: natives-*
          path: natives
          merge-multiple: true

      # The build checks that natives holds the jar of every platform before it
      # attaches them. A dry run assembles and signs the deployment bundle without
      # uploading it; the Central credentials are replaced by a placeholder as a
      # second line of defence, so an upload would fail on authentication instead
      # of publishing a release. Signing does run, so the GPG key stays intact.
      - name: Deploy
        env:
          MAVEN_USERNAME: ${{ inputs.dryRun && 'dry-run-must-not-upload' || secrets.MAVEN_USERNAME }}
          MAVEN_TOKEN: ${{ inputs.dryRun && 'dry-run-must-not-upload' || secrets.MAVEN_TOKEN }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          if [ "${{ inputs.dryRun }}" == "true" ]; then
            ./gradlew nmcpZipAggregation -Pnatives.dir=natives
          else
            ./gradlew publishAggregationToCentralPortal -Pnatives.dir=natives
          fi

      - name: Summarize what would have been published
        if: ${{ inputs.dryRun }}
        run: |
          {
            echo "## Dry run — nothing was published"
            echo
            echo "Version: \`${{ steps.release-version.outputs.version }}\`"
            echo
            echo "Contents of the deployment bundle:"
            echo '```'
            unzip -Z1 build/nmcp/zip/aggregation.zip
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the deployment bundle for inspection
        if: ${{ inputs.dryRun }}
        uses: actions/upload-artifact@v4
        with:
          name: deployment-bundle-dry-run
          path: build/nmcp/zip/aggregation.zip
          if-no-files-found: warn
          retention-days: 7

  publish-release:
    name: Publish GitHub release
    needs: publish-central
    if: ${{ !inputs.dryRun }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ needs.publish-central.outputs.release_version }}"
          body="${{ needs.publish-central.outputs.release_body }}"

          gh release create $version -d -t "Release $version" -n "$body"
