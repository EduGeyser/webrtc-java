name: Release

on:
  workflow_dispatch:
    inputs:
      developmentVersion:
        description: "Default version to use for new local working copy."
        required: true
        default: "X.Y.Z-sm.N-SNAPSHOT"
      dryRun:
        description: "Dry run: build every platform and assemble the deployment bundle, but push no commits or tags and publish nothing."
        required: false
        type: boolean
        default: false

# Only the jobs that push commits, tags or the GitHub release get write access.
permissions:
  contents: read

# Two releases at once would race on the pushed commits and tags.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Nothing reaches main before the release is prepared: the changelog commit,
  # the release commit, the tag and the development commit are made locally
  # and pushed in one atomic push at the end. A failure on the way leaves main
  # untouched, so the release can simply be dispatched again.
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.release-version.outputs.tag }}
      release_body: ${{ steps.git-cliff.outputs.content }}
    steps:
      # The full history, for git-cliff.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Git config
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

      # The release version is the one gradle.properties carries without
      # -SNAPSHOT, not one derived from the commits, so that the changelog, the
      # tag and the GitHub release always agree.
      - name: Determine and check the versions
        id: release-version
        env:
          DEVELOPMENT_VERSION: ${{ inputs.developmentVersion }}
        run: |
          current=$(sed -n 's/^version=//p' gradle.properties)
          version="${current%-SNAPSHOT}"
          echo "Release version: $version, next development version: $DEVELOPMENT_VERSION"

          if [ "$current" == "$version" ]; then
            echo "::error::gradle.properties has $current, which is not a snapshot"
            exit 1
          fi
          if ! [[ "$DEVELOPMENT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-sm\.[0-9]+-SNAPSHOT$ ]]; then
            echo "::error::developmentVersion must look like 1.2.3-sm.4-SNAPSHOT, got '$DEVELOPMENT_VERSION'"
            exit 1
          fi
          if [ "${DEVELOPMENT_VERSION%-SNAPSHOT}" == "$version" ]; then
            echo "::error::developmentVersion must differ from the release version $version"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::Tag v$version already exists"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Generate the release notes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        id: git-cliff
        with:
          config: .github/changelog/cliff-release.toml
          args: -v -u --strip footer --tag ${{ steps.release-version.outputs.tag }} --use-branch-tags

      # The new release's section is added on top of the file; the older
      # sections are left as they are.
      - name: Update CHANGELOG.md
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: .github/changelog/cliff.toml
          args: -v --prepend CHANGELOG.md -u --tag ${{ steps.release-version.outputs.tag }} --use-branch-tags

      # The release commit sets the release version and is tagged; the next
      # commit moves on to the development version and records the release in
      # the documentation. A dry run creates no commit and no tag.
      - name: Prepare release
        if: ${{ !inputs.dryRun }}
        env:
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
          RELEASE_TAG: ${{ steps.release-version.outputs.tag }}
          DEVELOPMENT_VERSION: ${{ inputs.developmentVersion }}
        run: |
          git add CHANGELOG.md
          git commit -m "chore(release): Update CHANGELOG.md for $RELEASE_TAG"

          sed -i "s/^version=.*/version=$RELEASE_VERSION/" gradle.properties
          git commit -am "Prepare release $RELEASE_TAG"
          git tag -a "$RELEASE_TAG" -m "$RELEASE_TAG"

          sed -i "s/^version=.*/version=$DEVELOPMENT_VERSION/" gradle.properties
          sed -i "s/VERSION: '.*'/VERSION: '$RELEASE_VERSION'/g" docs/.vitepress/versions.ts
          git commit -am "Prepare for next development iteration"

      # The branch and the tag land together or not at all.
      - name: Push release commits and tag
        if: ${{ !inputs.dryRun }}
        env:
          RELEASE_TAG: ${{ steps.release-version.outputs.tag }}
        run: git push --atomic origin HEAD:main "refs/tags/$RELEASE_TAG"

  # The tag prepare-release pushed. A dry run pushes none and builds the
  # dispatched commit instead. The variant is the one gradle.properties
  # selects.
  platforms:
    needs: prepare-release
    uses: ./.github/workflows/platforms.yml
    with:
      ref: ${{ !inputs.dryRun && needs.prepare-release.outputs.release_tag || '' }}
      retention-days: 7

  publish-central:
    name: Publish to Maven Central
    needs: [prepare-release, platforms]
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ !inputs.dryRun && needs.prepare-release.outputs.release_tag || '' }}

      - name: Set up JDK 27
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '27'
          distribution: 'liberica'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Determine the version to publish
        id: release-version
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties)

          echo "Version to publish: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The full variant adds the natives-media-* jars of the media module.
      - name: Download the native library jars of all platforms
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: natives-*
          path: natives
          merge-multiple: true

      # The build checks that natives holds the jar of every platform before it
      # attaches them. A dry run assembles and signs the deployment bundle without
      # uploading it; the Central credentials are replaced by a placeholder as a
      # second line of defence, so an upload would fail on authentication instead
      # of publishing a release. Signing does run, so the GPG key stays intact.
      - name: Deploy
        env:
          MAVEN_USERNAME: ${{ inputs.dryRun && 'dry-run-must-not-upload' || secrets.MAVEN_USERNAME }}
          MAVEN_TOKEN: ${{ inputs.dryRun && 'dry-run-must-not-upload' || secrets.MAVEN_TOKEN }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          if [ "${{ inputs.dryRun }}" == "true" ]; then
            ./gradlew nmcpZipAggregation -Pnatives.dir=natives
          else
            ./gradlew publishAggregationToCentralPortal -Pnatives.dir=natives
          fi

      - name: Summarize what would have been published
        if: ${{ inputs.dryRun }}
        run: |
          {
            echo "## Dry run: nothing was published"
            echo
            echo "Version: \`${{ steps.release-version.outputs.version }}\`"
            echo
            echo "Contents of the deployment bundle:"
            echo '```'
            unzip -Z1 build/nmcp/zip/aggregation.zip
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the deployment bundle for inspection
        if: ${{ inputs.dryRun }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployment-bundle-dry-run
          path: build/nmcp/zip/aggregation.zip
          if-no-files-found: warn
          retention-days: 7

  publish-release:
    name: Publish GitHub release
    needs: [prepare-release, publish-central]
    if: ${{ !inputs.dryRun }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The notes are commit subjects, so they go through the environment and a
      # file rather than into the script, where a quote or a backtick would run.
      # --verify-tag fails instead of creating a tag the release did not push.
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
          RELEASE_BODY: ${{ needs.prepare-release.outputs.release_body }}
        run: |
          printf '%s\n' "$RELEASE_BODY" > release-notes.md
          gh release create "$RELEASE_TAG" --draft --verify-tag \
            -t "Release $RELEASE_TAG" -F release-notes.md
