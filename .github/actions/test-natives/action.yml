name: 'Test Natives'

description: 'Run the test suite on a native runner against natives that a cross compiling lane built'

inputs:
  platform-name:
    description: 'The platform name of the lane that built the natives.'
    required: true

  classifier:
    description: 'The Maven classifier of the natives.'
    required: true

  variant:
    description: 'The variant of the native library: full, or data-channels for a library without audio and video support.'
    required: false
    default: ''

  version:
    description: 'The project version the native library jars were built with, when not the one gradle.properties sets.'
    required: false
    default: ''

  runner-image:
    description: 'The runner image, which tells the test reports of a platform apart.'
    required: true

  java-version:
    description: 'The Java version.'
    required: true
    default: '27'

  java-distribution:
    description: 'The setup-java distribution. It must provide a JDK for the runner architecture.'
    required: true
    default: 'liberica'

  java-architecture:
    description: 'The JDK architecture, when it differs from the runner architecture.'
    required: false
    default: ''

  jni-check:
    description: 'Run the tests under -Xcheck:jni instead, and fail on any JNI error or warning it reports.'
    required: false
    default: 'false'

runs:
  using: "composite"
  steps:
    # The variant of the native library comes from the input, or else from
    # gradle.properties. The full variant has the media and Swing modules as
    # well. The Swing view paints into images, which needs no display. The
    # JavaFX view needs one, so its tests skip on runners and do not run here.
    - name: Derive the variant
      run: |
        variant="${{ inputs.variant }}"
        if [ -z "$variant" ]; then
          variant=$(sed -n 's/^webrtc.variant=//p' gradle.properties)
        fi
        if [ "$variant" == "data-channels" ]; then
          echo "WEBRTC_VARIANT=data-channels" >> "$GITHUB_ENV"
          echo "WEBRTC_VARIANT_ARG=-Pwebrtc.variant=data-channels" >> "$GITHUB_ENV"
          echo "WEBRTC_TEST_TASKS=:webrtc:test" >> "$GITHUB_ENV"
        else
          echo "WEBRTC_VARIANT=full" >> "$GITHUB_ENV"
          echo "WEBRTC_VARIANT_ARG=-Pwebrtc.variant=full" >> "$GITHUB_ENV"
          echo "WEBRTC_TEST_TASKS=:webrtc:test :webrtc-media:test :webrtc-swing:test" >> "$GITHUB_ENV"
        fi
      shell: bash

    # Both native library jars of a platform land in the same directory.
    - name: Download natives
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: natives-${{ env.WEBRTC_VARIANT }}-${{ inputs.platform-name }}
        path: natives

    - name: Download media natives
      if: env.WEBRTC_VARIANT == 'full'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: natives-media-${{ inputs.platform-name }}
        path: natives

    # The full variant links the X11, GLib, GBM and libdrm libraries; the data
    # channels variant links nothing beyond glibc and libgcc_s. PulseAudio,
    # libudev and libdbus are deliberately not installed: the natives open
    # them at runtime, and the armhf lane, whose image has none of them,
    # proves that they load without them. Ubuntu 24.04 renamed the GLib
    # package.
    - name: Install runtime libraries
      if: runner.os == 'Linux'
      run: |
        if [ "${{ inputs.java-architecture }}" == "armv7" ]; then
          arch=":armhf"
          # Ubuntu 26.04 moved arm64 to the main archive, but armhf remains on ports.
          sources=/etc/apt/sources.list.d/ubuntu.sources
          if [ -f "$sources" ]; then
            . /etc/os-release
            native_arch=$(dpkg --print-architecture)
            sudo sed -i "/^Architectures:/d; /^Types:/a Architectures: $native_arch" "$sources"
            sudo tee /etc/apt/sources.list.d/ubuntu-armhf.sources >/dev/null <<EOF
        Types: deb
        URIs: https://ports.ubuntu.com/ubuntu-ports
        Suites: $VERSION_CODENAME $VERSION_CODENAME-updates $VERSION_CODENAME-backports $VERSION_CODENAME-security
        Components: main restricted universe multiverse
        Architectures: armhf
        Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
        EOF
          fi
          sudo dpkg --add-architecture armhf
          sudo apt-get update
          sudo apt-get install -y libc6:armhf libstdc++6:armhf zlib1g:armhf
        else
          arch=""
          sudo apt-get update
        fi

        if [ "$WEBRTC_VARIANT_ARG" == "-Pwebrtc.variant=full" ]; then
          # Ask apt whether it can install the renamed package. apt-cache show
          # also succeeds for a name that other packages only refer to, as
          # libglib2.0-0t64 is on Ubuntu 22.04, and a grep -q on apt-cache
          # policy can fail under pipefail when grep exits first.
          glib=libglib2.0-0
          if apt-get install -s "libglib2.0-0t64$arch" >/dev/null 2>&1; then
            glib=libglib2.0-0t64
          fi
          packages="libx11-6 libxext6 libxfixes3 libxdamage1 libxtst6 libxrandr2 libxcomposite1 $glib libgbm1 libdrm2"
          sudo apt-get install -y $(for p in $packages; do echo "$p$arch"; done)
        fi
      shell: bash

    - name: Set up JDK ${{ inputs.java-version }}
      uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        java-version: ${{ inputs.java-version }}
        distribution: ${{ inputs.java-distribution }}
        architecture: ${{ inputs.java-architecture }}

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

    # Gradle's native integration has no binaries for the 32-bit arm JDK, hence
    # the switches. The watchdog dumps and ends a run that hangs: the slowest
    # lane needs about 12 minutes for the whole job, and the job times out
    # after 30.
    - name: Test
      if: inputs.jni-check != 'true'
      env:
        VERSION: ${{ inputs.version }}
      run: |
        bash "$GITHUB_ACTION_PATH/hang-watchdog.sh" 20 &
        watchdog=$!
        status=0
        ./gradlew $WEBRTC_TEST_TASKS --continue -Pnatives.dir=natives -Pwebrtc.platform=${{ inputs.classifier }} $WEBRTC_VARIANT_ARG ${VERSION:+-Pversion=$VERSION} --no-daemon -Dorg.gradle.native=false -Dorg.gradle.vfs.watch=false || status=$?
        kill "$watchdog" 2> /dev/null || true
        exit $status
      shell: bash

    # The same tests under -Xcheck:jni, which checks every JNI call of the
    # natives: a fatal error ends the test JVM, and a call made without
    # checking for the exception the previous one may have thrown is a
    # warning. The JVM writes them to native stdout, which Gradle passes on to
    # its own output, so the log goes to a file: one warning comes with a whole
    # stack, and many of them would make an unreadable job log. The report counts
    # them, sums them up by where they come from and fails on any, so that a
    # missing check cannot creep back in.
    - name: Test under -Xcheck:jni
      if: inputs.jni-check == 'true'
      env:
        VERSION: ${{ inputs.version }}
      run: |
        status=0
        ./gradlew $WEBRTC_TEST_TASKS --continue -Pjni-check -Pnatives.dir=natives -Pwebrtc.platform=${{ inputs.classifier }} $WEBRTC_VARIANT_ARG ${VERSION:+-Pversion=$VERSION} --no-daemon -Dorg.gradle.native=false -Dorg.gradle.vfs.watch=false > jni-check.log 2>&1 || status=$?

        # What Gradle reported about the tests, which went to the file as well.
        grep -E 'tests completed|FAILED|BUILD (SUCCESSFUL|FAILED)' jni-check.log | tail -n 200 || true

        bash "$GITHUB_ACTION_PATH/jni-check-report.sh" jni-check.log 0 || status=1

        exit $status
      shell: bash

    # What failed, for runners that cannot be reproduced locally, including
    # the report the JVM writes into the module directory when it crashes and
    # the watchdog's dumps of a hung run.
    - name: Upload test reports
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: test-reports-${{ env.WEBRTC_VARIANT }}-${{ inputs.platform-name }}-${{ inputs.runner-image }}${{ inputs.jni-check == 'true' && '-jni-check' || '' }}
        # Under -Xcheck:jni, the first of its diagnostics with their stacks,
        # rather than the whole log.
        path: |
          */build/reports/tests/
          */build/test-results/
          */hs_err_pid*.log
          jni-check-excerpt.txt
          hang-dumps/
        if-no-files-found: ignore
        retention-days: 7
