name: 'Gradle Build'

description: 'Build the platform dependent Java library'

inputs:
  java-version:
    description: 'The Java build version.'
    required: true
    default: '27'

  platform-name:
    description: 'The target platform.'
    required: true

  variant:
    description: 'The variant of the native library: full, or data-channels for a library without audio and video support.'
    required: false
    default: ''

  upload-webrtc-install:
    description: 'Upload the compiled WebRTC install tree on a dispatched Linux x86-64 build.'
    required: false
    default: 'false'

runs:
  using: "composite"
  steps:
    - name: Derive the WebRTC cache branch from the build properties
      run: echo "WEBRTC_CACHE_BRANCH=$(sed -n 's|^webrtc.branch=||p' gradle.properties | tr '/' '-')" >> "$GITHUB_ENV"
      shell: bash

    # The variant of the native library comes from the input, or else from
    # gradle.properties. Each variant has its own WebRTC build and cache.
    - name: Derive the variant
      run: |
        variant="${{ inputs.variant }}"
        if [ -z "$variant" ]; then
          variant=$(sed -n 's/^webrtc.variant=//p' gradle.properties)
        fi
        if [ "$variant" == "data-channels" ]; then
          echo "WEBRTC_VARIANT=data-channels" >> "$GITHUB_ENV"
          echo "WEBRTC_VARIANT_SUFFIX=-data-channels" >> "$GITHUB_ENV"
          echo "WEBRTC_VARIANT_ARG=-Pwebrtc.variant=data-channels" >> "$GITHUB_ENV"
        else
          echo "WEBRTC_VARIANT=full" >> "$GITHUB_ENV"
          echo "WEBRTC_VARIANT_SUFFIX=" >> "$GITHUB_ENV"
          echo "WEBRTC_VARIANT_ARG=-Pwebrtc.variant=full" >> "$GITHUB_ENV"
        fi
      shell: bash

    - name: Fingerprint the native build
      id: native-build
      uses: ./.github/actions/native-build-fingerprint

    - name: Set up WebRTC cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/${{ env.WEBRTC_INSTALL_FOLDER }}${{ env.WEBRTC_VARIANT_SUFFIX }}
        key: webrtc-${{ env.WEBRTC_CACHE_BRANCH }}-${{ inputs.platform-name }}${{ env.WEBRTC_VARIANT_SUFFIX }}-${{ steps.native-build.outputs.fingerprint }}

    - name: Set up JDK ${{ inputs.java-version }}
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        java-version: ${{ inputs.java-version }}
        distribution: 'liberica'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

    # The cross compiled platforms are selected explicitly, the others are the
    # platform of the runner.
    - name: Select the platform
      run: |
        case "${{ inputs.platform-name }}" in
          linux_arm) platform="-Pwebrtc.platform=linux-aarch32" ;;
          linux_arm64) platform="-Pwebrtc.platform=linux-aarch64" ;;
          windows_arm64) platform="-Pwebrtc.platform=windows-aarch64" ;;
          macos_x86-64) platform="-Pwebrtc.platform=macos-x86_64" ;;
          *) platform="" ;;
        esac
        echo "WEBRTC_PLATFORM=$platform" >> "$GITHUB_ENV"
      shell: bash

    # The tests run in the test workflow, on every runner image, against the
    # uploaded jar.
    - name: Build
      run: ./gradlew assemble $WEBRTC_PLATFORM $WEBRTC_VARIANT_ARG
      shell: bash

    - name: Upload native library jar
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: natives-${{ inputs.platform-name }}
        path: webrtc-jni/build/libs/webrtc-java-*.jar
        if-no-files-found: error

    - name: Archive the compiled WebRTC install tree
      id: webrtc-install
      if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload-webrtc-install == 'true' && inputs.platform-name == 'linux_x86-64' }}
      run: |
        archive="$RUNNER_TEMP/webrtc-install-linux-x86_64-${WEBRTC_VARIANT}-${{ steps.native-build.outputs.fingerprint }}.tar.gz"
        # Tar preserves permissions and links that an artifact upload would lose.
        tar -czf "$archive" -C "$HOME/${WEBRTC_INSTALL_FOLDER}${WEBRTC_VARIANT_SUFFIX}" .
        echo "path=$archive" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Upload the compiled WebRTC install tree
      if: ${{ steps.webrtc-install.outputs.path != '' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: webrtc-install-linux-x86_64-${{ env.WEBRTC_VARIANT }}-${{ steps.native-build.outputs.fingerprint }}
        path: ${{ steps.webrtc-install.outputs.path }}
        if-no-files-found: error
        compression-level: 0
        retention-days: 7
