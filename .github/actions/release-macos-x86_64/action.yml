name: 'Gradle Release'

description: 'Release the platform dependent Java library'

inputs:
  java-version:
    description: 'The Java build version.'
    required: true
    default: '17'

  platform-name:
    description: 'The target platform.'
    required: true

runs:
  using: "composite"
  steps:
    - name: Derive the WebRTC cache branch from the build properties
      run: echo "WEBRTC_CACHE_BRANCH=$(sed -n 's|^webrtc.branch=branch-heads/||p' gradle.properties)" >> "$GITHUB_ENV"
      shell: bash

    # The variant of the native library comes from gradle.properties. Each
    # variant has its own WebRTC build and cache.
    - name: Derive the variant
      run: |
        variant=$(sed -n 's/^webrtc.variant=//p' gradle.properties)
        if [ "$variant" == "data-channels" ]; then
          echo "WEBRTC_VARIANT_SUFFIX=-data-channels" >> "$GITHUB_ENV"
        else
          echo "WEBRTC_VARIANT_SUFFIX=" >> "$GITHUB_ENV"
        fi
      shell: bash

    - name: Set up WebRTC cache
      uses: actions/cache@v4
      with:
        path: ~/${{ env.WEBRTC_INSTALL_FOLDER }}${{ env.WEBRTC_VARIANT_SUFFIX }}
        key: webrtc-${{ env.WEBRTC_CACHE_BRANCH }}-${{ inputs.platform-name }}${{ env.WEBRTC_VARIANT_SUFFIX }}-${{ hashFiles('webrtc-jni/src/main/cpp/dependencies/webrtc/CMakeLists.txt') }}-${{ hashFiles('webrtc-jni/build.gradle.kts') }}
        restore-keys: webrtc-${{ env.WEBRTC_CACHE_BRANCH }}-${{ inputs.platform-name }}${{ env.WEBRTC_VARIANT_SUFFIX }}-${{ hashFiles('webrtc-jni/src/main/cpp/dependencies/webrtc/CMakeLists.txt') }}-

    - name: Set up JDK ${{ inputs.java-version }}
      uses: actions/setup-java@v5
      with:
        architecture: 'x64'
        java-version: ${{ inputs.java-version }}
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Build
      run: arch -x86_64 ./gradlew assemble -Pwebrtc.platform=macos-x86_64
      shell: bash

    - name: Test
      run: arch -x86_64 ./gradlew :webrtc:test -Pwebrtc.platform=macos-x86_64
      shell: bash

    # Maven Central publishes a version as one atomic bundle, so this job must not
    # deploy. The native library jar is handed to the aggregating publish-central
    # job instead, which attaches every platform to a single deployment.
    - name: Upload native library jar
      uses: actions/upload-artifact@v4
      with:
        name: natives-${{ inputs.platform-name }}
        path: webrtc-jni/build/libs/webrtc-java-*.jar
        if-no-files-found: error
        retention-days: 7
        overwrite: true
