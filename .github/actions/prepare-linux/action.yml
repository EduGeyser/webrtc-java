name: 'Prepare Linux Build'

description: 'Frees up disk space and installs required packages for Linux builds.'

runs:
  using: "composite"
  steps:
    - name: Disk cleanup
      run: |
        set -x
        df -h
        #sudo du -h -d1 /usr/local
        #sudo du -h -d1 /usr/local/share
        #sudo du -h -d1 /usr/local/lib
        #sudo du -h -d1 /usr/share
        RMI=`docker images -q -a`
        if [ -n "$RMI" ]; then
          docker rmi $RMI
        fi
        # 4.6G
        sudo rm -rf /usr/local/.ghcup
        # 1.7G
        sudo rm -rf /usr/share/swift
        # 1.4G
        sudo rm -rf /usr/share/dotnet
        # 13G
        sudo rm -rf /usr/local/lib/android
        df -h
      shell: bash

    - name: Install required packages
      run: |
        sudo apt update
        sudo apt install -y binutils cmake git locales lsb-release ninja-build pipewire pipewire-pulse pkg-config python3 python3-setuptools rsync unzip wget xz-utils

      shell: bash

    # The JNI library is compiled against the libc++ bundled with WebRTC, which
    # only accepts the clang of its own age. Install the clang the WebRTC branch
    # is built with: its DEPS pins the tools revision whose update.py names the
    # package.
    - name: Install the clang of the WebRTC branch
      run: |
        branch=$(sed -n 's/^webrtc.branch=//p' gradle.properties)
        case "$branch" in
          */*) ref="refs/$branch" ;;
          *) ref="$branch" ;;
        esac

        tools=$(curl -sSf "https://webrtc.googlesource.com/src/+/$ref/DEPS?format=TEXT" | base64 -d \
          | grep -A1 "^  'src/tools':" | grep -oE '@[0-9a-f]{40}' | tr -d '@')
        update=$(curl -sSf "https://chromium.googlesource.com/chromium/src/tools/+/$tools/clang/scripts/update.py?format=TEXT" | base64 -d)
        revision=$(echo "$update" | sed -n "s/^CLANG_REVISION = '\(.*\)'/\1/p")
        sub=$(echo "$update" | sed -n 's/^CLANG_SUB_REVISION = \([0-9]*\)/\1/p')
        package="clang-$revision-$sub.tar.xz"
        echo "WebRTC $branch is built with $package"

        sudo mkdir -p /opt/clang
        wget -q "https://commondatastorage.googleapis.com/chromium-browser-clang/Linux_x64/$package"
        sudo tar -xf "$package" -C /opt/clang
        /opt/clang/bin/clang --version
      shell: bash

    - name: Install required packages for x86-64
      if: matrix.platform.name == 'linux_x86-64'
      run: |
        sudo mkdir /opt/sysroot
        python3 webrtc-jni/src/main/cpp/dependencies/webrtc/linux/sysroot/install-sysroot.py --arch=amd64
        sudo mv webrtc-jni/src/main/cpp/dependencies/webrtc/linux/debian* /opt/sysroot/
      shell: bash

    - name: Install required packages for arm
      if: matrix.platform.name == 'linux_arm'
      run: |
        sudo apt install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
        
        sudo mkdir /opt/sysroot
        python3 webrtc-jni/src/main/cpp/dependencies/webrtc/linux/sysroot/install-sysroot.py --arch=armhf
        sudo mv webrtc-jni/src/main/cpp/dependencies/webrtc/linux/debian* /opt/sysroot/
      shell: bash

    - name: Install required packages for arm64
      if: matrix.platform.name == 'linux_arm64'
      run: |
        sudo apt install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
        
        sudo mkdir /opt/sysroot
        python3 webrtc-jni/src/main/cpp/dependencies/webrtc/linux/sysroot/install-sysroot.py --arch=arm64
        sudo mv webrtc-jni/src/main/cpp/dependencies/webrtc/linux/debian* /opt/sysroot/
      shell: bash
