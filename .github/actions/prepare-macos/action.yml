name: 'Prepare macOS Build'

description: 'Installs required packages for macOS builds.'

runs:
  using: "composite"
  steps:
    - name: Install required packages
      run: |
        # Required on macos-14
        brew install python-setuptools
      shell: bash

    # The newest Xcode on the macOS 26 image. WebRTC builds with the selected
    # Xcode and accepts any macOS SDK from 15 on (mac_sdk_min in its
    # build/config/mac/mac_sdk_overrides.gni).
    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
      shell: bash
