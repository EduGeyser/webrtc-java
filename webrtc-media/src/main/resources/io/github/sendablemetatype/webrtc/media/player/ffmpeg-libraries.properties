# The FFmpeg libraries FFmpeg.java loads before the media module's own native
# library, per operating system, in the order they depend on each other and
# under the names they have in the platform jar. Their major versions change
# with every major FFmpeg release. The native build reads this file too and
# fails unless the list of its target is exactly the FFmpeg libraries it
# packages.
windows=avutil-61.dll swresample-7.dll swscale-10.dll avcodec-63.dll avformat-63.dll
macos=libavutil.61.dylib libswresample.7.dylib libswscale.10.dylib libavcodec.63.dylib libavformat.63.dylib
linux=libavutil.so.61 libswresample.so.7 libswscale.so.10 libavcodec.so.63 libavformat.so.63
